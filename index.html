<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>중국 스마트 여행 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#c8372d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+SC:wght@500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Layout: one phone-width app column — lacquer-red seal header, boarding-pass flight card, floating DiDi/Alipay dock above a 5-tab bar */
:root{
  --bg:#eef1ed; --surface:#ffffff; --surface-2:#f6f8f5; --ink:#18201c; --muted:#5f6b65; --line:#dde3de;
  --red:#c8372d; --red-ink:#ffffff; --red-soft:#fbe8e5; --jade:#1d7a62; --jade-soft:#e0f1ea;
  --gold:#a8730a; --gold-soft:#fbf1da; --didi:#ff7417; --ali:#1677ff; --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 18px rgba(20,30,25,.06);
  --f-body:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-cn:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1312; --surface:#181e1b; --surface-2:#1f2622; --ink:#ecf0ed; --muted:#9aa69f; --line:#2b3430;
  --red:#e8584b; --red-ink:#ffffff; --red-soft:#3a1d1a; --jade:#4cc39f; --jade-soft:#14302a;
  --gold:#e3b04b; --gold-soft:#33290f; --didi:#ff8a3d; --ali:#4b93ff; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1312; --surface:#181e1b; --surface-2:#1f2622; --ink:#ecf0ed; --muted:#9aa69f; --line:#2b3430;
  --red:#e8584b; --red-ink:#ffffff; --red-soft:#3a1d1a; --jade:#4cc39f; --jade-soft:#14302a;
  --gold:#e3b04b; --gold-soft:#33290f; --didi:#ff8a3d; --ali:#4b93ff; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--red)}
button,input,a{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{text-decoration:none}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.cn{font-family:var(--f-cn)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}

.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:150px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.top-in{background:var(--red);color:var(--red-ink);display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.seal{flex:none;width:38px;height:38px;border-radius:9px;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center;
  font-family:var(--f-cn);font-weight:900;font-size:20px;line-height:1;transform:rotate(-4deg)}
.brand h1{font-size:16px;font-weight:900;letter-spacing:-.02em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-act{display:flex;gap:6px;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.on-red{background:rgba(0,0,0,.22);color:#fff}
.pill.on-red.ghost{background:rgba(255,255,255,.16)}

.cities{background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:8px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cities-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold)}
.city-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.city-row::-webkit-scrollbar{display:none}
.city{flex:none;display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:700;color:var(--muted)}
.city.on{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.city .iata{font-family:var(--f-mono);font-size:10px;opacity:.7}

/* Main */
main{display:flex;flex-direction:column;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:12px;animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(5px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.sec-title{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.sec-title h2{font-size:17px;font-weight:900;letter-spacing:-.02em}
.sec-title p{font-size:12px;color:var(--muted);margin-top:2px}
.label{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:10px;padding:7px 11px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.jade{background:var(--jade-soft);border-color:transparent;color:var(--jade)}
.btn.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.btn.sm{padding:5px 9px;font-size:11px;border-radius:8px}
.btn:active,.pill:active,.tile:active,.city:active{transform:scale(.97)}
.row{display:flex;gap:6px;flex-wrap:wrap}

/* Boarding pass */
.pass{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.pass-main{padding:14px 16px 12px}
.pass-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.pass-top .tag{color:var(--red);letter-spacing:.08em}
.route{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.port{min-width:0}
.port b{display:block;font-family:var(--f-mono);font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.port span{font-size:11px;color:var(--muted)}
.port.r{text-align:right}
.fly{flex:1;display:flex;align-items:center;gap:6px;color:var(--red);min-width:40px}
.fly i{flex:1;border-top:2px dashed var(--line)}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 14px}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-26px}.perf::after{right:-26px}
.pass-stub{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;padding:12px 16px 14px}
.kv span{display:block;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.kv b{font-family:var(--f-mono);font-size:17px;font-weight:800}
.kv em{font-style:normal;font-size:10px;color:var(--muted);margin-left:3px;font-family:var(--f-body);font-weight:500}

/* Now card */
.now{display:flex;gap:12px;align-items:center}
.now .big{flex:none;width:58px;height:58px;border-radius:14px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;text-align:center;font-family:var(--f-mono);font-weight:800;font-size:15px;line-height:1.1}
.now .big small{display:block;font-size:9px;font-family:var(--f-body);font-weight:700}
.now .txt{min-width:0;flex:1}
.now .txt b{display:block;font-size:14px}
.now .txt p{font-size:12px;color:var(--muted)}

/* App launcher */
.apps-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.apps-head h3{font-size:14px;font-weight:900}
.link{font-size:11px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.app-t{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);text-align:center;min-width:0}
.app-t .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;font-family:var(--f-cn)}
.app-t b{font-size:11px;line-height:1.2}
.app-t small{font-size:9.5px;color:var(--muted);line-height:1.2}
.ic.didi{background:var(--didi)}.ic.ali{background:var(--ali)}.ic.map{background:var(--jade)}

/* Hotel / misc */
.hotel{display:flex;justify-content:space-between;gap:10px;align-items:center}
.hotel h4{font-size:14px;font-weight:700;margin-top:2px}
.hotel .cn{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700;box-shadow:var(--shadow)}
.tile .e{font-size:22px;line-height:1}
.banner{display:flex;align-items:center;gap:12px;cursor:pointer}
.banner .e{flex:none;width:42px;height:42px;border-radius:12px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-family:var(--f-cn);font-weight:900;font-size:18px}
.banner .t{flex:1;min-width:0}
.banner .t b{font-size:14px}
.banner .t p{font-size:12px;color:var(--muted)}
.count{display:inline-block;font-size:10px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--red);color:var(--red-ink);margin-left:6px;vertical-align:2px}
.chev{color:var(--muted);font-size:20px}
.ex{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.ex label{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px}
.ex input,.field input{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-mono);font-size:16px;font-weight:700;min-width:0}
.ex .sw{padding-bottom:10px;color:var(--muted);font-weight:700}
.ex-rate{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--muted)}
.ex-rate input{width:76px;padding:4px 6px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-mono);font-size:12px;font-weight:700}
.note{display:flex;gap:8px;font-size:12px;color:var(--muted);line-height:1.55}
.note b{color:var(--ink)}

/* Schedule */
.sum{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);color:var(--gold);font-size:12px;font-weight:700}
.day{padding:0;overflow:hidden}
.day-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.day-n{flex:none;font-family:var(--f-mono);font-weight:800;font-size:12px;padding:3px 8px;border-radius:7px;background:var(--ink);color:var(--surface)}
.day.today .day-n{background:var(--red);color:var(--red-ink)}
.day-h h3{font-size:14px;font-weight:700;flex:1;min-width:0}
.today-tag{font-size:10px;font-weight:800;color:var(--red);flex:none}
.tl{list-style:none;margin:0;padding:10px 14px 12px}
.tl li{display:grid;grid-template-columns:52px 14px 1fr;gap:8px;align-items:start;padding:6px 0;position:relative}
.tl .tm{font-family:var(--f-mono);font-weight:800;font-size:13px;padding-top:1px}
.tl .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:5px;position:relative;z-index:1}
.tl li::before{content:"";position:absolute;left:64px;top:0;bottom:0;border-left:2px solid var(--line)}
.tl li:first-child::before{top:12px}.tl li:last-child::before{bottom:calc(100% - 12px)}
.tl .tx{font-size:13px;line-height:1.5}
.tl li.k-flight .dot{border-color:var(--red);background:var(--red)}
.tl li.k-hotel .dot{border-color:var(--jade)}
.tl li.k-flight .tx{font-weight:700}
.tl li.past{opacity:.45}
.tl li.next .tx{font-weight:700}
.tl li.next .tm{color:var(--red)}
.tl li.next .dot{border-color:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
.plus{font-size:9px;color:var(--muted);margin-left:2px}
.drop{border-style:dashed;box-shadow:none;background:transparent}
.drop h4{font-size:13px;font-weight:700;margin-bottom:6px}
.drop ul{margin:0;padding-left:18px;font-size:12px;color:var(--muted)}

/* Route */
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.flow li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;position:relative;padding:5px 0}
.flow li::before{content:"";position:absolute;left:12px;top:0;bottom:0;border-left:2px dashed var(--line)}
.flow li:first-child::before{top:50%}.flow li:last-child::before{bottom:50%}
.flow .n{position:relative;z-index:1;width:26px;height:26px;border-radius:50%;background:var(--red);color:var(--red-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:800;font-size:12px}
.flow .s{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:700}
.spot{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.spot:first-of-type{border-top:0;padding-top:4px}
.spot-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.spot-h h4{font-size:14px;font-weight:700}
.chip{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--gold-soft);color:var(--gold);margin-bottom:3px}
.spot .cn{font-size:15px;font-weight:700}
.spot p.d{font-size:12px;color:var(--muted)}

/* Food */
.food h4{font-size:15px;font-weight:700}
.food .cn{font-size:20px;font-weight:900;margin-top:4px;line-height:1.25}
.food .py{font-size:12px;color:var(--muted);font-style:italic}
.food p.d{font-size:12.5px;color:var(--muted);margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.food .row{margin-top:10px}

/* Phrases */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--muted)}
.fchip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ph-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);font-weight:700}
.ph .kr{font-size:14px;font-weight:700;margin-top:6px}
.ph .cnbox{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.ph .cn{font-size:18px;font-weight:900;line-height:1.4}
.ph .pr{font-size:12.5px;font-weight:700;color:var(--red);margin-top:4px}
.ph .py{font-size:11.5px;color:var(--muted);font-style:italic}
.ph .tip{font-size:12px;color:var(--muted);margin-top:8px}
.ph .row{margin-top:10px}

/* Dock + tabs */
.dock{position:fixed;z-index:45;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.dock a{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;color:#fff;font-weight:900;font-size:13px;white-space:nowrap}
.dock .didi{background:var(--didi)}.dock .pay{background:var(--ali)}
.dock a:active{transform:scale(.96)}
.tabs{position:fixed;z-index:44;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:10.5px;font-weight:700;color:var(--muted)}
.tab .e{font-size:19px;line-height:1;filter:grayscale(.8);opacity:.75}
.tab.on{color:var(--red)}
.tab.on .e{filter:none;opacity:1}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-card{position:relative;width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-size:16px;font-weight:900}
.x{width:32px;height:32px;border-radius:50%;background:var(--surface-2);font-weight:700;color:var(--muted)}
.sheet-body{overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>b{font-size:13px}
.field small{font-size:11px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{padding:9px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:11.5px;font-weight:700;color:var(--muted)}
.seg button.on{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.box{padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.inline{display:flex;gap:6px;align-items:center}
.inline input{flex:1}
.check{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;accent-color:var(--jade);flex:none;margin-top:1px}
.check b{display:block;font-size:13.5px}
.check small{font-size:11.5px;color:var(--muted)}
.check.done b{text-decoration:line-through;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.steps li::marker{font-family:var(--f-mono);font-weight:800;color:var(--red)}

/* Show card (taxi / order) */
.show{position:fixed;inset:0;z-index:80;background:var(--surface);display:flex;flex-direction:column;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.show-top{display:flex;justify-content:space-between;align-items:center}
.show-top span{font-size:12px;font-weight:700;color:var(--muted)}
.show-mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;max-width:560px;margin:0 auto;width:100%}
.show-lead{font-family:var(--f-cn);font-size:clamp(22px,6vw,30px);font-weight:700;color:var(--red)}
.show-cn{font-family:var(--f-cn);font-size:clamp(34px,11vw,64px);font-weight:900;line-height:1.2;word-break:break-all}
.show-sub{font-size:14px;color:var(--muted)}
.show-act{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:560px;margin:0 auto;width:100%}
.show-act .btn{padding:13px;font-size:14px;border-radius:14px}
.show-act .full{grid-column:1/-1}
.btn.didi{background:var(--didi);border-color:var(--didi);color:#fff}
.btn.ali{background:var(--ali);border-color:var(--ali);color:#fff}

.toast{position:fixed;z-index:90;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);max-width:calc(100% - 32px);
  background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:12.5px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:360px){.apps,.tiles{grid-template-columns:repeat(2,1fr)}.port b{font-size:26px}}
</style>

/* =====================================================================
   비행기 시간 기반 일정 엔진
   - 1일차: 도착 + 입국/이동(약 1시간 50분) 이후의 원래 일정만 남김
   - 마지막 날: 이륙 2시간 30분 전 공항 도착, 그 1시간 전 호텔 출발
   - 시간이 안 맞아 빠진 일정은 "놓친 추천"으로 따로 보여줌
   ===================================================================== */
const AIRPORT_RE = /공항|귀국|항공편|체크인/;
function parseItem(s){ const m = String(s).match(/^(\d{1,2}):(\d{2})\s+(.*)$/); return m ? { t:(+m[1])*60 + (+m[2]), text:m[3] } : null; }
function baseDay(c, i){ return ((c.schedules[i] || {}).timeline || []).map(parseItem).filter(x => x && !AIRPORT_RE.test(x.text)); }
const EXTRA_DAYS = [
  c => ({ title:"근교 명소 & 예술 거리 산책", items:[
    [600, `${c.name} 근교 유적지·예술 문화 단지 방문`], [780, "현지인 인기 숨은 맛집 점심"],
    [930, "전통 찻집에서 차 한 잔 & 휴식"], [1170, "전망 좋은 곳에서 마지막 야경 감상"] ] }),
  c => ({ title:"박물관·공연 문화 데이", items:[
    [600, `${c.name} 대표 박물관 또는 정원 관람`], [780, `${(c.foods[2]||c.foods[0]).name} 점심`],
    [930, "발 마사지(足疗)로 피로 풀기"], [1140, "야간 공연(전통극·서커스·분수쇼) 관람"] ] }),
  c => ({ title:"쇼핑 & 카페 투어", items:[
    [630, "트렌디한 거리·편집숍 구경"], [780, "브런치 카페 & 베이커리"],
    [930, "마트(허마셴셩·까르푸)에서 소스·차·간식 선물 쇼핑"], [1140, "여행 마무리 만찬"] ] })
];
function buildSchedule(c, days, arr, dep){
  const out = [], dropped = [];
  const ready = arr + 110;
  // 1일차
  const d1 = [
    { t:arr, text:`${c.name} 공항 도착 · 입국 심사 후 지하철/DiDi로 시내 이동`, k:"flight" },
    { t:arr + 100, text:`${c.hotel.split("(")[0].trim()} 숙소 체크인 · 짐 풀기`, k:"hotel" }
  ];
  const b1 = baseDay(c, 0);
  b1.forEach(x => (x.t >= ready && x.t <= 23*60) ? d1.push(x) : dropped.push({ day:1, ...x }));
  const firstKept = d1.slice(2).sort((a,b)=>a.t-b.t)[0];
  if (ready <= 21*60 && (!firstKept || firstKept.t - ready >= 150)) {
    d1.push({ t:ready + 20, text:`숙소 근처 가볍게 산책 · ${c.spots[1] ? c.spots[1].name : "번화가"} 둘러보기` });
  }
  if (ready > 21*60 && d1.length === 2) d1.push({ t:ready + 10, text:"편의점 야식 사서 휴식 (내일을 위해 체력 충전!)" });
  out.push({ title:`도착 & ${c.name} 첫날`, items:d1 });

  // 중간 날
  const mids = days - 2;
  for (let i = 0; i < mids; i++) {
    if (i < 2 && c.schedules[i + 1]) {
      out.push({ title:c.schedules[i + 1].title, items:baseDay(c, i + 1) });
    } else {
      const e = EXTRA_DAYS[(i - 2) % EXTRA_DAYS.length](c);
      out.push({ title:e.title, items:e.items.map(([t, text]) => ({ t, text })) });
    }
  }
  if (days === 3 && c.schedules[2]) baseDay(c, 2).forEach(x => dropped.push({ day:3, ...x }));

  // 마지막 날
  const atAirport = dep - 150, leave = atAirport - 60;
  const last = [];
  baseDay(c, 3).forEach(x => (x.t + 90 <= leave) ? last.push(x) : dropped.push({ day:days, ...x }));
  if (leave > 12*60 + 30) {
    last.push({ t:11*60 + 30, text:"체크아웃 후 프런트에 짐 맡기기 (寄存行李)", k:"hotel" });
    if (!last.some(x => /점심|식사|만찬|정식/.test(x.text)) && leave >= 13*60 + 30)
      last.push({ t:12*60 + 15, text:`마지막 식사: ${(c.foods[3] || c.foods[0]).name}` });
    last.push({ t:leave, text:"호텔에서 짐 찾아 공항으로 이동 (DiDi·공항철도)", k:"hotel" });
  } else {
    if (!last.length && leave >= 8*60 + 30) last.push({ t:Math.max(7*60 + 30, leave - 90), text:"호텔 조식 후 짐 정리" });
    last.push({ t:leave, text:"체크아웃 후 바로 공항으로 이동 (DiDi·공항철도)", k:"hotel" });
  }
  last.push({ t:atAirport, text:"공항 도착 · 체크인/출국 심사 (남은 위안화는 면세점에서)", k:"flight" });
  last.push({ t:dep, text:"귀국편 이륙 ✈ 수고하셨어요!", k:"flight" });
  out.push({ title:"마무리 & 귀국", items:last });

  out.forEach(d => d.items.sort((a, b) => a.t - b.t));
  return { days:out, dropped };
}

function nowCard(c, plan){
  const idx = tripDayIndex();
  if (idx === null) return `
    <div class="card now">
      <div class="big">D-?<small>출발일</small></div>
      <div class="txt"><b>출발일을 넣어 보세요</b><p>D-day와 여행 중 "지금 다음 일정"을 알려드려요.</p></div>
      <button class="btn sm" data-act="flight">설정</button>
    </div>`;
  if (idx < 0) {
    const done = PREP.filter(p => S.checks[p.id]).length;
    return `
    <div class="card now">
      <div class="big">D-${-idx}<small>출발까지</small></div>
      <div class="txt"><b>준비물 ${done}/${PREP.length} 완료</b><p>알리페이 카드 연결과 DiDi 설치는 한국에서 미리 해 두세요.</p></div>
      <button class="btn sm jade" data-act="prep">체크</button>
    </div>`;
  }
  if (idx >= S.days) return `
    <div class="card now">
      <div class="big">끝<small>여행 완료</small></div>
      <div class="txt"><b>${esc(c.name)} 여행 수고하셨어요</b><p>다음 여행 날짜를 넣으면 새로 계산해 드려요.</p></div>
      <button class="btn sm" data-act="flight">새 일정</button>
    </div>`;
  const day = plan.days[idx];
  const nm = nowMin();
  const next = day.items.find(x => x.t >= nm - 20);
  return `
    <div class="card now">
      <div class="big">${idx + 1}일차<small>지금</small></div>
      <div class="txt">
        ${next ? `<b><span class="mono">${hm(next.t)}</span> ${esc(next.text)}</b><p>${esc(day.title)}</p>`
               : `<b>오늘 일정 끝!</b><p>푹 쉬고 내일 일정도 확인해 보세요.</p>`}
      </div>
      <button class="btn sm" data-tab="schedule">일정</button>
    </div>`;
}

function viewSchedule(c, plan){
  const ft = flightTimes();
  const idx = tripDayIndex();
  const nm = nowMin();
  return `
  <div class="sec-title">
    <div><h2>${esc(c.name)} ${S.days}일 맞춤 일정표</h2><p>${S.custom ? "내 비행기 시간에 맞춰 자동 계산" : "도시 기본 항공 시간 기준 · 내 시간으로 바꿔 보세요"}</p></div>
    <button class="btn sm red" data-act="flight">✈ 재설정</button>
  </div>
  <div class="sum"><span>🛬 1일차 <span class="mono">${hm(ft.arr)}</span> 도착 → 🛫 ${S.days}일차 <span class="mono">${hm(ft.dep)}</span> 이륙</span><span>${nightsLabel(S.days)}</span></div>
  ${plan.days.map((d, i) => {
    const today = idx === i;
    let nextMarked = false;
    return `
    <section class="card day ${today ? "today" : ""}">
      <div class="day-h"><span class="day-n">DAY ${i + 1}</span><h3>${esc(d.title)}</h3>${today ? `<span class="today-tag">오늘</span>` : S.start ? `<span class="label">${esc(dateOfDay(i))}</span>` : ""}</div>
      <ol class="tl">
        ${d.items.map(x => {
          const f = fmt(x.t);
          let cls = x.k ? "k-" + x.k : "";
          if (today) {
            if (x.t < nm - 20) cls += " past";
            else if (!nextMarked) { cls += " next"; nextMarked = true; }
          }
          return `<li class="${cls}"><span class="tm">${f.t}${f.d > 0 ? `<span class="plus">+${f.d}</span>` : ""}</span><span class="dot"></span><span class="tx">${esc(x.text)}</span></li>`;
        }).join("")}
      </ol>
    </section>`;
  }).join("")}
  ${plan.dropped.length ? `
  <section class="card drop">
    <h4>비행기 시간 때문에 빠진 일정</h4>
    <ul>${plan.dropped.map(x => `<li>원래 ${x.day}일차 ${hm(x.t)} · ${esc(x.text)}</li>`).join("")}</ul>
    <p class="note" style="margin-top:8px">시간이 남는 날에 끼워 넣어 보세요.</p>
  </section>` : ""}`;
}

function pgroup(cat){
  if (cat.startsWith("결제")) return "결제";
  if (cat.startsWith("식당")) return "식당";
  if (cat.startsWith("택시")) return "택시";
  if (/쇼핑|관광|사진/.test(cat)) return "쇼핑·관광";
  return "생활";
}

function applyFlight(){
  const a = toMin($("fArr").value), d = toMin($("fDep").value);
  if (a === null || d === null) { toast("도착·이륙 시각을 모두 입력해 주세요"); return; }
  S.arr = a; S.dep = d; S.custom = true; S.days = tmpDays; S.start = $("fStart").value || "";
  save(); closeSheet(); S.tab = "schedule"; render(); window.scrollTo(0, 0);
  toast(`${nightsLabel(S.days)} 맞춤 일정을 만들었어요`);
}

function openAddr(){
  const c = city();
  openSheet(`${c.name} 주소 모음`, `
    <p class="note">🚕 택시카드는 기사님께 보여주는 큰 글씨 화면이에요. 복사한 주소는 DiDi·고덕지도 검색창에 붙여넣으세요.</p>
    <div>${spotBlock(c, "숙소: " + c.hotel, c.hotelCn, "숙소", "")}${c.spots.map(s => spotBlock(c, s.name, s.cn, s.tag, "")).join("")}</div>
    ${eatsSection(c, "필수 맛집 주소")}`);
}

const PREP = [
  { id:"passport", t:"여권 (유효기간 6개월 이상)", s:"사진 페이지를 휴대폰에도 저장해 두세요." },
  { id:"visa", t:"무비자 입국 가능 여부·체류 기간 확인", s:"출발 전 외교부 해외안전여행·중국대사관 공지로 최신 기준 확인" },
  { id:"alipay", t:"알리페이 설치 + 해외카드 연결 + 실명인증", s:"한국에서 미리 해야 현지에서 막히지 않아요. 지하철 승차코드도 알리페이로." },
  { id:"didi", t:"DiDi 앱 설치 (또는 알리페이 속 DiDi)", s:"휴대폰 번호 인증까지 한국에서 끝내 두세요." },

  { id:"translate", t:"번역 앱 (파파고 등) 오프라인 중국어 받기", s:"이 앱의 회화 탭과 함께 쓰면 든든해요." },
  { id:"cash", t:"비상용 현금 위안화 조금", s:"작은 노점·택시 대비 (100~300위안 정도)." },
  { id:"power", t:"보조배터리 (3C 인증 표시)", s:"중국 국내선은 3C 표시 없는 보조배터리 반입을 막을 수 있어요." },
  { id:"plug", t:"멀티 어댑터", s:"중국은 220V. 콘센트 모양이 달라 멀티 어댑터가 편해요." },
  { id:"tissue", t:"휴지·물티슈", s:"식당·화장실에 휴지가 없거나 유료인 곳이 있어요." },
  { id:"medicine", t:"상비약 (소화제·지사제·진통제)", s:"마라 음식 대비!" }
];
function prepHtml(){
  const done = PREP.filter(p => S.checks[p.id]).length;
  return `
    <div class="field"><b>${done} / ${PREP.length} 완료</b><div class="bar"><i style="width:${Math.round(done / PREP.length * 100)}%"></i></div></div>
    <div>${PREP.map(p => `
      <label class="check ${S.checks[p.id] ? "done" : ""}">
        <input type="checkbox" id="chk-${p.id}" data-check="${p.id}" ${S.checks[p.id] ? "checked" : ""}>
        <span><b>${esc(p.t)}</b><small>${esc(p.s)}</small></span>
      </label>`).join("")}</div>
    <p class="note">체크한 내용은 이 휴대폰에만 저장돼요.</p>`;
}
function openPrep(){ openSheet("여행 준비물 체크리스트", prepHtml()); }

function openTips(){
  const c = city();
  openSheet(`${c.name} 문화 & 여행 팁`, `
    <div class="box"><b>🚇 ${esc(c.name)} 교통</b><p class="note">${esc(c.transit)}</p></div>
    <ol class="steps">
      <li><b>결제는 거의 다 QR</b> — 알리페이 "결제코드"는 내가 보여주는 것, "QR 스캔"은 가게 QR을 찍는 것.</li>
      <li><b>지하철·버스</b> — 알리페이 검색창에 "乘车码"를 쳐서 도시 승차코드를 켜 두면 교통카드 없이 타요.</li>
      <li><b>택시</b> — DiDi에서 목적지를 중국어로 붙여넣는 게 가장 정확해요. 이 앱의 "DiDi로 가기"는 주소를 먼저 복사해 줘요.</li>
      <li><b>보안검색</b> — 지하철역 입구마다 짐 검사가 있어요. 시간을 조금 넉넉히 잡으세요.</li>
      <li><b>명소 예약</b> — 인기 명소는 여권으로 하루 전 예약이 필요한 곳이 많아요. 현장 창구는 회화 #15를 보여주세요.</li>
      <li><b>팁 문화 없음</b> — 식당·택시에서 팁은 주지 않아도 돼요.</li>
      <li><b>뜨거운 물</b> — 식당 물은 기본이 따뜻한 물이나 차예요. 찬물은 "要冰的".</li>
    </ol>`);
}

function storeLinks(key){
  const a = APPS[key];
  return `<div class="row">
    <a class="btn sm" href="${a.play}" target="_blank" rel="noopener">Play 스토어</a>
    <a class="btn sm" href="${a.ios}" target="_blank" rel="noopener">App Store</a></div>`;
}
function openAppHelp(key, reason){
  const head = reason === "desktop"
    ? `<p class="note">📱 이 버튼은 <b>휴대폰</b>에서 눌러야 앱이 열려요. 휴대폰 브라우저로 이 페이지를 열어 주세요.</p>`
    : reason === "fail"
    ? `<p class="note">앱이 열리지 않았다면 아래를 확인해 주세요.</p>`
    : `<p class="note">버튼을 누르면 휴대폰에 설치된 앱이 바로 열려요.</p>`;
  const list = key ? [key] : ["didi", "alipay_pay", "amap"];
  openSheet(reason === "fail" ? `${APPS[key].short} 앱이 안 열리나요?` : "중국 필수 앱 안내", `
    ${head}
    <ol class="steps">
      <li><b>앱 설치 확인</b> — 설치되어 있지 않으면 스토어에서 받아 주세요.</li>
      <li><b>미리보기 화면에서는 막혀요</b> — 채팅 앱·AI 미리보기 안에서 열었다면, 크롬·사파리·삼성인터넷에서 직접 열거나 홈 화면에 추가해 쓰세요.</li>
      <li><b>DiDi 대신</b> — 알리페이 검색창에 <span class="cn">滴滴出行</span>을 입력하면 알리페이 안에서 DiDi를 부를 수 있어요.</li>
    </ol>
    ${list.map(k => `<div class="box"><b>${esc(APPS[k].name)}</b><small class="note">${esc(APPS[k].what)}</small>${storeLinks(k)}</div>`).join("")}
    <div class="row"><button class="btn" data-act="copy" data-text="滴滴出行">"滴滴出行" 복사</button><a class="btn ali" href="#" data-app="alipay_pay">알리페이 열기</a></div>`);
}

/* =====================================================================
   큰 화면 카드 (택시카드 · 주문카드 · 회화)
   ===================================================================== */
function openShow(kind, text, label, sub){
  const c = city();
  let lead = "", say = text, acts = "";
  if (kind === "place") {
    lead = "师傅，请带我去这里";
    say = "师傅，请带我去" + text;
    acts = `
      <a class="btn didi" href="${appHref("didi")}" data-app="didi" data-text="${esc(text)}">🚕 DiDi 호출 (주소 복사)</a>
      <a class="btn jade" href="${amapSearch(text, c.cn)}" target="_blank" rel="noopener">고덕지도</a>`;
  } else if (kind === "food") {
    lead = "我要这个，谢谢";
    say = text + "，我要这个，谢谢";
    acts = `<a class="btn ali" href="${appHref("alipay_scan")}" data-app="alipay_scan">QR 스캔 결제</a><a class="btn ali" href="${appHref("alipay_pay")}" data-app="alipay_pay">결제코드</a>`;
  }
  $("show").innerHTML = `
    <div class="show-top"><span>${kind === "place" ? "기사님께 보여주세요" : kind === "food" ? "점원에게 보여주세요" : "상대방에게 보여주세요"}</span><button class="x" data-act="closeShow" aria-label="닫기">✕</button></div>
    <div class="show-mid">
      ${lead ? `<p class="show-lead">${lead}</p>` : ""}
      <p class="show-cn">${esc(text)}</p>
      <p class="show-sub">${esc(label)}${sub ? `<br>${esc(sub)}` : ""}</p>
    </div>
    <div class="show-act">
      <button class="btn red" data-act="say" data-text="${esc(say)}">🔊 읽어주기</button>
      <button class="btn" data-act="copy" data-text="${esc(text)}">복사</button>
      ${acts}
    </div>`;
  $("show").hidden = false;
}

/* =====================================================================
   음성 · 복사 · 토스트
   ===================================================================== */
function gtUrl(text){ return `https://translate.google.com/?sl=zh-CN&tl=ko&text=${encodeURIComponent(text)}&op=translate`; }
function openSayHelp(text, reason){
  $("show").hidden = true;
  openSheet("발음 듣기", `
    <p class="note">${reason === "none"
      ? "지금 열린 화면(카카오톡 등 앱 안 브라우저)에서는 음성 기능을 쓸 수 없어요."
      : "중국어 음성이 나오지 않았어요. 휴대폰에 중국어 음성이 설치되지 않았을 수 있어요."}</p>
    <div class="box">
      <p class="cn" style="font-size:20px;font-weight:900">${esc(text)}</p>
      <a class="btn red" href="${gtUrl(text)}" target="_blank" rel="noopener">구글 번역에서 듣기 (🔊 버튼 누르기)</a>
    </div>
    <ol class="steps">
      <li><b>크롬·삼성인터넷에서 열기</b> — 카카오톡 안이 아니라 브라우저나 홈 화면 아이콘으로 열면 대부분 바로 돼요.</li>
      <li><b>중국어 음성 설치 (갤럭시)</b> — 설정 검색창에 "TTS" 입력 → 텍스트 음성 변환 → 기본 엔진 옆 ⚙ → 음성 데이터 설치 → <b>중국어</b> 받기</li>
      <li><b>아이폰</b> — 설정 → 손쉬운 사용 → 읽기 및 말하기 → 음성 → <b>중국어</b> 음성 받기</li>
      <li><b>무음 모드 확인</b> — 휴대폰 소리(미디어 볼륨)가 켜져 있는지 확인해 주세요.</li>
    </ol>`);
}
function say(text){
  if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") { openSayHelp(text, "none"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN"; u.rate = 0.85;
  const voices = speechSynthesis.getVoices();
  const v = voices.find(v => /zh[-_]CN|cmn/i.test(v.lang)) || voices.find(v => /zh/i.test(v.lang));
  if (v) u.voice = v;
  let started = false;
  u.onstart = () => { started = true; };
  u.onerror = () => openSayHelp(text, "fail");
  speechSynthesis.speak(u);
  toast("🔊 " + text);
  if (voices.length && !v) setTimeout(() => openSayHelp(text, "fail"), 600);
  else setTimeout(() => { if (!started && !speechSynthesis.speaking) openSayHelp(text, "fail"); }, 2500);
}
if ("speechSynthesis" in window) speechSynthesis.getVoices();

function copy(text, quietMsg){
  const done = () => toast(quietMsg || `복사했어요: ${text}`);
  const fallback = () => {
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); done(); } catch(e) { toast("복사가 막혀 있어요. 글자를 길게 눌러 복사해 주세요"); }
    t.remove();
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  } catch(e) { fallback(); }
}
let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2200);
}

/* =====================================================================
   앱 호출 처리
   ===================================================================== */
let appTimer;
function handleApp(e, a){
  const key = a.dataset.app;
  if (a.dataset.text) copy(a.dataset.text, `목적지 복사됨 · ${APPS[key].short}에 붙여넣으세요`);
  if (!IS_ANDROID && !IS_IOS) { e.preventDefault(); openAppHelp(key, "desktop"); return; }
  a.setAttribute("href", appHref(key));
  clearTimeout(appTimer);
  appTimer = setTimeout(() => { if (!document.hidden) openAppHelp(key, "fail"); }, 2500);
}
document.addEventListener("visibilitychange", () => { if (document.hidden) clearTimeout(appTimer); });
window.addEventListener("pagehide", () => clearTimeout(appTimer));
window.addEventListener("blur", () => clearTimeout(appTimer));

/* =====================================================================
   이벤트
   ===================================================================== */
document.addEventListener("click", e => {
  const a = e.target.closest("[data-app]");
  if (a) { handleApp(e, a); return; }
  const b = e.target.closest("[data-act],[data-tab],[data-city]");
  if (!b) return;
  if (b.dataset.tab) { closeSheet(); $("show").hidden = true; S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.city) { S.city = b.dataset.city; save(); render(); return; }
  const t = b.dataset.text || "";
  switch (b.dataset.act) {
    case "copy": copy(t); break;
    case "say": say(t); break;
    case "flight": openFlight(); break;
    case "addr": openAddr(); break;
    case "prep": openPrep(); break;
    case "tips": openTips(); break;
    case "apphelp": openAppHelp(null, "info"); break;
    case "close": closeSheet(); break;
    case "closeShow": $("show").hidden = true; break;
    case "show": openShow(b.dataset.kind, t, b.dataset.label || "", b.dataset.sub || ""); break;
    case "applyFlight": applyFlight(); break;
    case "resetFlight": S.custom = false; save(); closeSheet(); render(); toast("도시 기본 시간으로 되돌렸어요"); break;
    case "days":
      tmpDays = +t;
      document.querySelectorAll("#segDays button").forEach(x => x.classList.toggle("on", +x.dataset.text === tmpDays));
      break;
    case "kor": {
      const k = toMin($("fKor").value);
      if (k === null) { toast("한국 출발 시각을 입력해 주세요"); break; }
      $("fArr").value = hm(k + city().fly - 60);
      toast(`현지 도착 약 ${hm(k + city().fly - 60)}로 넣었어요`);
      break;
    }
    case "pcat": S.pcat = t; save(); render(); break;
  }
});
document.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.check;
  if (id) {
    S.checks[id] = e.target.checked; save();
    const y = $("sheetBody").scrollTop; $("sheetBody").innerHTML = prepHtml(); $("sheetBody").scrollTop = y;
    if (S.tab === "home") render();
  }
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id !== "exC" && id !== "exK" && id !== "exR") return;
  const num = v => parseFloat(String(v).replace(/,/g, "")) || 0;
  if (id === "exR") { S.rate = num(e.target.value) || S.rate; save(); }
  if (id === "exC" || id === "exR") $("exK").value = Math.round(num($("exC").value) * S.rate).toLocaleString("ko-KR");
  else $("exC").value = (Math.round(num($("exK").value) / S.rate * 10) / 10).toString();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeSheet(); $("show").hidden = true; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".banner[data-tab]")) { e.preventDefault(); e.target.click(); }
});

render();
setInterval(() => { if (S.tab === "home" || S.tab === "schedule") { if ($("sheet").hidden && $("show").hidden && !document.activeElement.matches("input")) render(); } }, 60000);
</script>
